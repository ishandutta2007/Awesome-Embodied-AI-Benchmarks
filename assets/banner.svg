<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#101935" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Card / Glow Gradients -->
    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <radialGradient id="particleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="40" cy="0" r="1.5" fill="rgba(56, 189, 248, 0.25)" />
    </pattern>

    <filter id="blurFilter">
      <feGaussianBlur stdDeviation="60" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .metric-value {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 20px;
      fill: #38bdf8;
    }
    .metric-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 12px;
      fill: #64748b;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#cyberGrid)" />

  <!-- Animated Ambient Nebula Lights (Background) -->
  <g opacity="0.35" filter="url(#blurFilter)">
    <circle cx="180" cy="80" r="110" fill="#38bdf8">
      <animate attributeName="cx" values="180;230;180" dur="10s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="1020" cy="260" r="130" fill="#a855f7">
      <animate attributeName="cy" values="260;200;260" dur="12s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.25;0.55;0.25" dur="9s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="180" r="90" fill="#6366f1">
      <animate attributeName="r" values="90;130;90" dur="11s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Animated Sensor Radar Wave (Right Corner Background) -->
  <g transform="translate(1040, 180)" opacity="0.4">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#38bdf8" stroke-width="1.5">
      <animate attributeName="r" values="20;120" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#818cf8" stroke-width="1.5">
      <animate attributeName="r" values="45;145" dur="4s" begin="1.3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0" dur="4s" begin="1.3s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#c084fc" stroke-width="1.5">
      <animate attributeName="r" values="70;170" dur="4s" begin="2.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0" dur="4s" begin="2.6s" repeatCount="indefinite" />
    </circle>
    <!-- Center Core Node -->
    <circle cx="0" cy="0" r="6" fill="#38bdf8">
      <animate attributeName="transform" type="scale" values="1;1.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Flow Data Particles (Background Animation) -->
  <g opacity="0.6">
    <circle cx="120" cy="290" r="3" fill="#38bdf8">
      <animate attributeName="cy" values="320;60;320" dur="14s" repeatCount="indefinite" />
      <animate attributeName="cx" values="120;160;120" dur="14s" repeatCount="indefinite" />
    </circle>
    <circle cx="1060" cy="100" r="3.5" fill="#c084fc">
      <animate attributeName="cy" values="100;300;100" dur="16s" repeatCount="indefinite" />
      <animate attributeName="cx" values="1060;1020;1060" dur="16s" repeatCount="indefinite" />
    </circle>
    <circle cx="850" cy="310" r="2.5" fill="#818cf8">
      <animate attributeName="cy" values="310;80;310" dur="13s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Foreground Content (Solid, High-Contrast, Never Obscured) -->
  <g transform="translate(60, 42)">
    <!-- Header Badge Pill -->
    <rect x="0" y="0" width="280" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <circle cx="18" cy="16" r="4.5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="34" y="21" class="badge-text" fill="#38bdf8">CURATED BENCHMARKS &amp; SIM</text>

    <!-- Main Title -->
    <text x="0" y="85" class="title-text" fill="url(#cyberGlow)">Awesome Embodied AI Benchmarks</text>

    <!-- Subtitle -->
    <text x="0" y="125" class="sub-text">Standardized Environments, VLA Evaluation &amp; Physics-Driven Robot Learning</text>

    <!-- Feature Tags / Metric Cards (Horizontal Layout) -->
    <g transform="translate(0, 160)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="190" height="66" rx="10" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
        <rect x="14" y="14" width="4" height="38" rx="2" fill="#38bdf8" />
        <text x="28" y="34" class="metric-value">15+ Repos</text>
        <text x="28" y="52" class="metric-label">Open-Source Suites</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(205, 0)">
        <rect width="210" height="66" rx="10" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
        <rect x="14" y="14" width="4" height="38" rx="2" fill="#818cf8" />
        <text x="28" y="34" class="metric-value">30,000+ FPS</text>
        <text x="28" y="52" class="metric-label">GPU Physics Sim</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(430, 0)">
        <rect width="210" height="66" rx="10" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
        <rect x="14" y="14" width="4" height="38" rx="2" fill="#c084fc" />
        <text x="28" y="34" class="metric-value">VLA &amp; Humanoid</text>
        <text x="28" y="52" class="metric-label">Manipulation &amp; Nav</text>
      </g>

      <!-- Card 4 -->
      <g transform="translate(655, 0)">
        <rect width="200" height="66" rx="10" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
        <rect x="14" y="14" width="4" height="38" rx="2" fill="#34d399" />
        <text x="28" y="34" class="metric-value">Sim-to-Real</text>
        <text x="28" y="52" class="metric-label">Zero-Shot &amp; Robustness</text>
      </g>
    </g>

    <!-- Bottom Highlight Chips -->
    <g transform="translate(0, 248)">
      <text x="0" y="16" class="metric-label" fill="#64748b" font-weight="600">KEY DOMAINS:</text>
      <g transform="translate(100, 0)">
        <rect width="105" height="24" rx="12" fill="rgba(255,255,255,0.06)" />
        <text x="52" y="16" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Robotics</text>
      </g>
      <g transform="translate(215, 0)">
        <rect width="130" height="24" rx="12" fill="rgba(255,255,255,0.06)" />
        <text x="65" y="16" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">MuJoCo &amp; Isaac</text>
      </g>
      <g transform="translate(355, 0)">
        <rect width="125" height="24" rx="12" fill="rgba(255,255,255,0.06)" />
        <text x="62" y="16" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Mobile Manip</text>
      </g>
      <g transform="translate(490, 0)">
        <rect width="150" height="24" rx="12" fill="rgba(255,255,255,0.06)" />
        <text x="75" y="16" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Habitats &amp; Scenes</text>
      </g>
    </g>
  </g>
</svg>
